name: Business inquiry
description: Discuss a non-confidential Python automation or Windows tool requirement.
title: "Business inquiry: "
body:
  - type: markdown
    attributes:
      value: |
        This is a PUBLIC discussion. Do not share passwords, tokens, private email addresses, customer records, real security logs or confidential business details. Describe the task in general terms and use synthetic examples only. A private communication method can be agreed separately.
  - type: textarea
    id: task
    attributes:
      label: What would you like to automate?
      description: Describe the repetitive steps and the expected result, without private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and deliverable
      description: For example, Windows 11, CSV inputs and a portable desktop tool.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public discussion
      options:
        - label: I have excluded confidential information, personal data and credentials.
          required: true
